# .github/workflows/build-arm64.yml
name: Build tunet-rust (ARM64 CLI-only)
on: [push, pull_request, workflow_dispatch]
jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm   # 原生 ARM64 runner
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Deps
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev
      - name: Build CLI only
        run: |
          # 只编 CLI，不编 GUI（避免拉上 Qt）
          cargo build --release -p tunet -p tunet-service
      - uses: actions/upload-artifact@v4
        with:
          name: tunet-aarch64-cli
          path: |
            target/release/tunet
            target/release/tunet-service
