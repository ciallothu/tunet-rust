name: "Build tunet-rust for OpenWrt (MT7981, vendored OpenSSL, static)"

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

env:
  CARGO_TERM_COLOR: always
  OPENWRT_SDK_URL: "https://downloads.openwrt.org/releases/23.05.0/targets/mediatek/filogic/openwrt-sdk-23.05.0-mediatek-filogic_gcc-12.3.0_musl.Linux-x86_64.tar.xz"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Cache Cargo"
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: "Install host deps (vendored OpenSSL needs perl/make etc.)"
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gawk zlib1g-dev libncurses5-dev \
            flex bison gettext file \
            unzip rsync wget curl git python3 perl \
            ca-certificates xz-utils tar zip \
            pkg-config cmake ninja-build jq coreutils

      - name: "Set up Rust + musl"
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustup target add aarch64-unknown-linux-musl
          rustc -V && cargo -V

      - name: "Download OpenWrt SDK (linker/sysroot only)"
        run: |
          mkdir -p openwrt-sdk
          wget -q "${OPENWRT_SDK_URL}" -O sdk.tar.xz
          tar -C openwrt-sdk --strip-components=1 -xf sdk.tar.xz
          rm -f sdk.tar.xz
          ls -lah openwrt-sdk

      - name: "Export SDK toolchain env"
        id: sdk
        run: |
          set -eux
          SDK=$PWD/openwrt-sdk
          TOOLCHAIN_DIR=$(ls -d $SDK/staging_dir/toolchain-* | head -n1)
          TARGET_DIR=$(ls -d $SDK/staging_dir/target-* | head -n1)
          echo "toolchain=$TOOLCHAIN_DIR" >> $GITHUB_OUTPUT
          echo "target=$TARGET_DIR" >> $GITHUB_OUTPUT
          echo "cc=$TOOLCHAIN_DIR/bin/aarch64-openwrt-linux-musl-gcc" >> $GITHUB_OUTPUT
          echo "ar=$TOOLCHAIN_DIR/bin/aarch64-openwrt-linux-musl-ar" >> $GITHUB_OUTPUT
          echo "strip=$TOOLCHAIN_DIR/bin/aarch64-openwrt-linux-musl-strip" >> $GITHUB_OUTPUT
          echo "sysroot=$TARGET_DIR" >> $GITHUB_OUTPUT

      - name: "Configure Cargo for cross (musl, static)"
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<CFG
          [target.aarch64-unknown-linux-musl]
          linker = "${{ steps.sdk.outputs.cc }}"
          ar     = "${{ steps.sdk.outputs.ar }}"
          rustflags = [
            "-C", "link-arg=--sysroot=${{ steps.sdk.outputs.sysroot }}",
            "-C", "target-feature=+crt-static"
          ]
          CFG
          cat .cargo/config.toml

      - name: "Build (vendored OpenSSL, fully static)"
        env:
          # 关键：强制使用 openssl-sys vendored，并静态链接
          OPENSSL_NO_VENDOR: "0"
          OPENSSL_STATIC: "1"
          # 一些 crate 在 musl + static 下需要 libunwind；如遇链接错误，可启用下一行：
          # RUSTFLAGS: "-C link-args=-static -Clink-arg=-Wl,--as-needed"
        run: |
          set -eux
          unset OPENSSL_DIR OPENSSL_LIB_DIR OPENSSL_INCLUDE_DIR
          cargo build --release --target aarch64-unknown-linux-musl \
            -p tunet -p tunet-service

      - name: "Package artifacts"
        run: |
          set -eux
          mkdir -p dist
          cp target/aarch64-unknown-linux-musl/release/tunet         dist/tunet-openwrt-aarch64-static
          cp target/aarch64-unknown-linux-musl/release/tunet-service dist/tunet-service-openwrt-aarch64-static
          "${{ steps.sdk.outputs.strip }}" dist/* || true
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -lh dist
          cat dist/SHA256SUMS.txt

      - name: "Upload artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: tunet-openwrt-mt7981-aarch64-static
          path: dist/

      - name: "Release on tag"
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
