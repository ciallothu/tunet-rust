name: "Build tunet-rust for OpenWrt (MT7981 aarch64_cortex-a53)"

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  OPENWRT_SDK_URL: "https://downloads.openwrt.org/releases/23.05.0/targets/mediatek/filogic/openwrt-sdk-23.05.0-mediatek-filogic_gcc-12.3.0_musl.Linux-x86_64.tar.xz"

jobs:
  build-openwrt-mt7981:
    runs-on: ubuntu-24.04

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Cache Cargo"
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: "Install host deps"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential wget curl xz-utils tar rsync \
            python3 pkg-config cmake ninja-build perl \
            git unzip jq coreutils file

      - name: "Set up Rust (stable) + musl target"
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustup target add aarch64-unknown-linux-musl
          rustc -V && cargo -V

      - name: "Download & extract OpenWrt SDK"
        run: |
          mkdir -p openwrt-sdk
          wget -q "${OPENWRT_SDK_URL}" -O sdk.tar.xz
          tar -C openwrt-sdk --strip-components=1 -xf sdk.tar.xz
          rm -f sdk.tar.xz
          ls -lah openwrt-sdk

      # 只做 defconfig；不要 install -a 以免拉到不匹配的 feeds 触发递归依赖
      - name: "SDK defconfig (no full feeds install)"
        working-directory: ${{ github.workspace }}/openwrt-sdk
        run: |
          ./scripts/feeds update -a || true    # 允许失败/网络波动；SDK 自带 package/ 树
          make defconfig

      # 智能定位 openssl 目标；找不到就 fall back 到 vendored OpenSSL
      - name: "Build OpenSSL into staging_dir (smart)"
        id: openssl
        working-directory: ${{ github.workspace }}/openwrt-sdk
        shell: bash
        run: |
          set -euo pipefail
          SDK="$PWD"

          CORE_MK="$SDK/package/libs/openssl/Makefile"
          FEEDS_MK="$SDK/feeds/packages/libs/openssl/Makefile"

          TARGET=""
          if [[ -f "$CORE_MK" ]]; then
            TARGET="package/libs/openssl/compile"
          elif [[ -f "$FEEDS_MK" ]]; then
            TARGET="package/feeds/packages/openssl/compile"
          fi

          if [[ -n "$TARGET" ]]; then
            echo "Using target: $TARGET"
            make -j1 V=s "$TARGET"
            echo "mode=staging" >> $GITHUB_OUTPUT
          else
            echo "::warning::OpenSSL package not found in SDK (core/feeds). Will use openssl-sys vendored mode."
            echo "mode=vendored" >> $GITHUB_OUTPUT
          fi

          ls -d $SDK/staging_dir/toolchain-* || true
          ls -d $SDK/staging_dir/target-*    || true

      - name: "Export SDK toolchain env"
        id: sdk
        working-directory: ${{ github.workspace }}/openwrt-sdk
        shell: bash
        run: |
          set -euo pipefail
          SDK="$PWD"
          TOOLCHAIN_DIR=$(ls -d $SDK/staging_dir/toolchain-* | head -n1)
          TARGET_DIR=$(ls -d $SDK/staging_dir/target-*    | head -n1)
          echo "toolchain=$TOOLCHAIN_DIR" >> $GITHUB_OUTPUT
          echo "target=$TARGET_DIR"       >> $GITHUB_OUTPUT
          echo "cc=$TOOLCHAIN_DIR/bin/aarch64-openwrt-linux-musl-gcc" >> $GITHUB_OUTPUT
          echo "ar=$TOOLCHAIN_DIR/bin/aarch64-openwrt-linux-musl-ar"   >> $GITHUB_OUTPUT
          echo "strip=$TOOLCHAIN_DIR/bin/aarch64-openwrt-linux-musl-strip" >> $GITHUB_OUTPUT
          echo "pkgcfg=$TOOLCHAIN_DIR/bin/pkg-config"                  >> $GITHUB_OUTPUT
          echo "pcpath=$TARGET_DIR/usr/lib/pkgconfig:$TARGET_DIR/usr/share/pkgconfig" >> $GITHUB_OUTPUT
          echo "sysroot=$TARGET_DIR"        >> $GITHUB_OUTPUT
          echo "openssl_dir=$TARGET_DIR/usr" >> $GITHUB_OUTPUT

      - name: "Configure Cargo for cross (aarch64-unknown-linux-musl)"
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<CFG
          [target.aarch64-unknown-linux-musl]
          linker = "${{ steps.sdk.outputs.cc }}"
          ar     = "${{ steps.sdk.outputs.ar }}"
          rustflags = ["-C", "link-arg=--sysroot=${{ steps.sdk.outputs.sysroot }}"]
          CFG
          echo "---- .cargo/config.toml ----"
          cat .cargo/config.toml

      - name: "Build (CLI only: tunet + tunet-service)"
        env:
          # 交叉构建公共设置
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG: "${{ steps.sdk.outputs.pkgcfg }}"
          PKG_CONFIG_SYSROOT_DIR: "${{ steps.sdk.outputs.sysroot }}"
          PKG_CONFIG_PATH: "${{ steps.sdk.outputs.pcpath }}"
          RUSTFLAGS: "-C target-feature=+crt-static"

          # 如果上一阶段成功把 openssl 装进 staging_dir，就用它；
          # 否则自动切换到 openssl-sys vendored
          OPENSSL_DIR: "${{ steps.sdk.outputs.openssl_dir }}"
          OPENSSL_LIB_DIR: "${{ steps.sdk.outputs.openssl_dir }}/lib"
          OPENSSL_INCLUDE_DIR: "${{ steps.sdk.outputs.openssl_dir }}/include"
          OPENSSL_STATIC: ${{ steps.openssl.outputs.mode == 'staging' && '0' || '1' }}
          OPENSSL_NO_VENDOR: ${{ steps.openssl.outputs.mode == 'staging' && '1' || '0' }}
        run: |
          if [[ "${{ steps.openssl.outputs.mode }}" == "vendored" ]]; then
            echo "== Using openssl-sys vendored mode =="
          else
            echo "== Using SDK staged OpenSSL =="
          fi

          cargo build --release --target aarch64-unknown-linux-musl \
            -p tunet -p tunet-service

      - name: "Collect & package artifacts"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          bins=(
            "target/aarch64-unknown-linux-musl/release/tunet"
            "target/aarch64-unknown-linux-musl/release/tunet-service"
          )

          found=0
          for b in "${bins[@]}"; do
            if [[ -x "$b" ]]; then
              cp "$b" "dist/$(basename "$b")-openwrt-aarch64"
              ((found++)) || true
            fi
          done

          if [[ $found -eq 0 ]]; then
            echo "::error::没有找到交叉编译产物。请检查构建日志。"
            exit 1
          fi

          "${{ steps.sdk.outputs.strip }}" dist/* || true

          (cd dist && sha256sum * > SHA256SUMS.txt)
          echo "---- SHA256SUMS ----"
          cat dist/SHA256SUMS.txt

          cat > dist/README.txt <<'TXT'
          tunet / tunet-service for OpenWrt (MT7981 aarch64_cortex-a53, musl)
          - Built with OpenWrt 23.05.0 mediatek/filogic SDK
          - Target: aarch64-unknown-linux-musl
          - OpenSSL: SDK staged OR openssl-sys vendored (auto)
          TXT

      - name: "Upload artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: tunet-openwrt-mt7981-aarch64
          path: dist/

      - name: "Release (on tag)"
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true