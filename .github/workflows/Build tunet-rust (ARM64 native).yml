name: Build tunet-rust (ARM64 + Qt5)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-arm64-qt5:
    name: ARM64 (Ubuntu 22.04) Qt5 build
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cargo registry/git/target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arm64-cargo-

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies (OpenSSL, Qt5, toolchain)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            qtbase5-dev qtbase5-dev-tools qtchooser qt5-qmake \
            qttools5-dev qttools5-dev-tools \
            libgl1-mesa-dev
          # 验证 qmake 可用且是 Qt5
          qmake -v || true
          which qmake || true

      # 重要：让 winio-ui-qt 的 build.rs 明确找到 Qt5 的 qmake
      - name: Build (Qt5 + whole workspace, exclude native)
        env:
          QT_VERSION_MAJOR: "5"
          QMAKE: qmake
          RUST_BACKTRACE: "1"
        run: |
          cargo build --release --workspace --exclude native

      - name: Strip & package
        run: |
          mkdir -p dist
          # 可选：strip 以减小体积（不影响运行）
          find target/release -maxdepth 1 -type f -executable -exec file {} \; | awk -F: '/ELF 64-bit LSB executable/ {print $1}' | while read -r bin; do
            cp "$bin" "dist/$(basename "$bin")-aarch64"
          done
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tunet-rust-arm64-qt5
          path: dist/

      # Tag 推送时自动发布 Release 并附带二进制
      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
