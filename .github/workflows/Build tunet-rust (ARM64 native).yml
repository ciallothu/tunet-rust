name: "Build tunet-rust for OpenWrt (MT7981, SDK OpenSSL)"

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

env:
  CARGO_TERM_COLOR: always
  OPENWRT_SDK_URL: "https://downloads.openwrt.org/releases/23.05.0/targets/mediatek/filogic/openwrt-sdk-23.05.0-mediatek-filogic_gcc-12.3.0_musl.Linux-x86_64.tar.xz"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Cache Cargo"
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: "Install host deps"
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gawk zlib1g-dev libncurses5-dev \
            flex bison gettext xsltproc file \
            unzip rsync wget curl git python3 perl \
            ca-certificates xz-utils tar zip \
            pkg-config cmake ninja-build jq coreutils

      - name: "Set up Rust + musl"
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustup target add aarch64-unknown-linux-musl
          rustc -V && cargo -V

      - name: "Download OpenWrt SDK (mediatek/filogic)"
        run: |
          mkdir -p openwrt-sdk
          wget -q "${OPENWRT_SDK_URL}" -O sdk.tar.xz
          tar -C openwrt-sdk --strip-components=1 -xf sdk.tar.xz
          rm -f sdk.tar.xz
          ls -lah openwrt-sdk

      - name: "SDK defconfig (no feeds install)"
        working-directory: ${{ github.workspace }}/openwrt-sdk
        run: |
          set -eux
          make defconfig

      - name: "Build OpenSSL into staging_dir"
        id: openssl
        working-directory: ${{ github.workspace }}/openwrt-sdk
        shell: bash
        run: |
          set -euo pipefail
          SDK="$PWD"
          CORE_MK="$SDK/package/libs/openssl/Makefile"
          FEEDS_MK="$SDK/feeds/packages/libs/openssl/Makefile"
          if [[ -f "$CORE_MK" ]]; then
            PKG="package/libs/openssl"
          elif [[ -f "$FEEDS_MK" ]]; then
            PKG="package/feeds/packages/openssl"
          else
            echo "::error::OpenSSL Makefile not found in SDK (core/feeds)."
            exit 2
          fi
          echo "Using OpenSSL pkg: $PKG"
          make -j1 V=sc ${PKG}/prepare
          make -j1 V=sc ${PKG}/compile
          make -j1 V=sc ${PKG}/install

          TARGET_DIR=$(ls -d "$SDK"/staging_dir/target-* | head -n1)
          test -f "$TARGET_DIR/usr/include/openssl/ssl.h"
          ls "$TARGET_DIR/usr/lib"/libssl.* >/dev/null 2>&1

          echo "target=$TARGET_DIR" >> $GITHUB_OUTPUT

      - name: "Export SDK toolchain env"
        id: sdk
        working-directory: ${{ github.workspace }}/openwrt-sdk
        shell: bash
        run: |
          set -euo pipefail
          SDK="$PWD"
          TOOLCHAIN_DIR=$(ls -d $SDK/staging_dir/toolchain-* | head -n1)
          TARGET_DIR=$(ls -d $SDK/staging_dir/target-*    | head -n1)
          echo "toolchain=$TOOLCHAIN_DIR" >> $GITHUB_OUTPUT
          echo "target=$TARGET_DIR"       >> $GITHUB_OUTPUT
          echo "cc=$TOOLCHAIN_DIR/bin/aarch64-openwrt-linux-musl-gcc" >> $GITHUB_OUTPUT
          echo "ar=$TOOLCHAIN_DIR/bin/aarch64-openwrt-linux-musl-ar"   >> $GITHUB_OUTPUT
          echo "strip=$TOOLCHAIN_DIR/bin/aarch64-openwrt-linux-musl-strip" >> $GITHUB_OUTPUT
          echo "pkgcfg=$TOOLCHAIN_DIR/bin/pkg-config"                  >> $GITHUB_OUTPUT
          echo "pcpath=$TARGET_DIR/usr/lib/pkgconfig:$TARGET_DIR/usr/share/pkgconfig" >> $GITHUB_OUTPUT
          echo "sysroot=$TARGET_DIR"        >> $GITHUB_OUTPUT
          echo "openssl_dir=$TARGET_DIR/usr" >> $GITHUB_OUTPUT

      - name: "Configure Cargo for cross"
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<CFG
          [target.aarch64-unknown-linux-musl]
          linker = "${{ steps.sdk.outputs.cc }}"
          ar     = "${{ steps.sdk.outputs.ar }}"
          rustflags = ["-C", "link-arg=--sysroot=${{ steps.sdk.outputs.sysroot }}"]
          CFG
          cat .cargo/config.toml

      - name: "Build (with SDK OpenSSL)"
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG: "${{ steps.sdk.outputs.pkgcfg }}"
          PKG_CONFIG_SYSROOT_DIR: "${{ steps.sdk.outputs.sysroot }}"
          PKG_CONFIG_PATH: "${{ steps.sdk.outputs.pcpath }}"
          OPENSSL_DIR: "${{ steps.sdk.outputs.openssl_dir }}"
          OPENSSL_LIB_DIR: "${{ steps.sdk.outputs.openssl_dir }}/lib"
          OPENSSL_INCLUDE_DIR: "${{ steps.sdk.outputs.openssl_dir }}/include"
        run: |
          set -eux
          cargo build --release --target aarch64-unknown-linux-musl \
            -p tunet -p tunet-service

      - name: "Package artifacts"
        run: |
          set -eux
          mkdir -p dist
          cp target/aarch64-unknown-linux-musl/release/tunet         dist/tunet-openwrt-aarch64
          cp target/aarch64-unknown-linux-musl/release/tunet-service dist/tunet-service-openwrt-aarch64
          "${{ steps.sdk.outputs.strip }}" dist/* || true
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -lh dist
          cat dist/SHA256SUMS.txt

      - name: "Upload artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: tunet-openwrt-mt7981-aarch64
          path: dist/

      - name: "Release on tag"
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
